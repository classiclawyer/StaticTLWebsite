<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#faf8f4" />
    <meta
      name="description"
      content="The dream jewelry you have longed for may one day become your signature stack—and perhaps, a legacy to pass on. Atelier Tamara de Launay creates the piece of your dreams with natural or lab-grown diamonds and colored gemstones, for you and you alone. From Paris to Seoul, made just for you."
    />
    <title>Atelier Tamara de Launay</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/brand/favicon-32.png" />
    <link rel="shortcut icon" href="assets/images/brand/favicon.ico" />
    <link rel="stylesheet" href="assets/css/site.css" />
  </head>
  <body>
    <header>
      <div class="top">
        <a class="identity" href="#home" aria-label="Atelier Tamara de Launay home">
          <img
            class="brand-logo"
            src="assets/images/brand/variants/full-logo/gold-transparent.svg"
            width="180"
            height="101"
            alt="Atelier Tamara de Launay"
          />
        </a>
        <button class="menu" id="menu" aria-label="Open menu" aria-expanded="false">☰</button>
        <nav id="nav"></nav>
        <div class="languages" id="languages"></div>
      </div>
    </header>
    <main id="app"></main>
    <footer>
      <div class="foot-inner">
        <a class="footer-identity" href="#home" aria-label="Atelier Tamara de Launay home">
          <img
            class="brand-logo"
            src="assets/images/brand/variants/full-logo/gold-transparent.svg"
            width="260"
            height="146"
            alt="Atelier Tamara de Launay"
          />
        </a>
        <div class="links" id="footlinks"></div>
      </div>
      <div class="fine">© <span id="year"></span> Atelier Tamara de Launay</div>
    </footer>
    <script type="module" src="assets/js/site.js"></script>
  </body>
</html>
