const labels={"en":{"home":"Home","story":"Brand Story","collection":"Made-to-order Fine Jewelry","bespoke":"Bespoke High Jewelry","stones":"The Atelier Standard","contact":"Contact / Appointment","privacy":"Privacy policy","terms":"Terms","discover":"Discover the fine jewelry collection","begin":"Begin a custom / bespoke commission","legal":"Terms & Privacy","cart":"Cart","wishlist":"Wishlist"},"ko":{"home":"홈","story":"브랜드 스토리","collection":"주문제작 파인 주얼리","bespoke":"비스포크 하이 주얼리","stones":"아뜰리에의 기준","contact":"문의 및 상담 예약","privacy":"개인정보 처리방침","terms":"이용약관","discover":"파인 주얼리 컬렉션 살펴보기","begin":"1:1 맞춤제작 주얼리 문의","legal":"이용약관 및 개인정보 안내","cart":"장바구니","wishlist":"위시리스트"}};
const copy={"en":{"heroTitle":"Fine jewelry without the nonsensical markup.","heroStatement":"The dream jewelry you have longed for may one day become your signature stack—and perhaps, a legacy to pass on. Atelier Tamara de Launay creates the piece of your dreams with natural or lab-grown diamonds and colored gemstones, for you and you alone. From Paris to Seoul, made just for you.","statement":"The dream jewelry you have longed for may one day become your signature stack—and perhaps, a legacy to pass on. Atelier Tamara de Launay creates the piece of your dreams with natural or lab-grown diamonds and colored gemstones, for you and you alone. From Paris to Seoul, made just for you.","homeEyebrow":"FROM PARIS TO SEOUL<br>SHIPS WORLDWIDE","introTitle":"Heritage for the next century starts here: yours and ours.","intro":"We were raised to believe that a piece should speak through its materials and craftsmanship. We work with both natural and lab-grown diamonds and colored gemstones, always choosing quality in the stones, design, making, and service. Every stone is hand-picked; every piece is made to be worn for a lifetime and, one day, passed on.","homeBespoke":"A truly bespoke commission, at your pace and budget.","homeBespokeText":"From private commissions starting in the thousands to extraordinary high jewelry valued in the millions, every proposal is shaped around your vision, budget, and timeline. Share your most ambitious jewelry dream—we will bring it to life.","storyLead":"A personal note from Tamara","storyP":["I grew up surrounded by luxury. Designer pieces were part of the landscape of my childhood home, and the jewelry my family wore was usually a gift from someone we loved. I learned to see a piece as a playful part of our family style before I ever thought of it as a label.","Over time, I began to ask different questions. Signature motifs seemed to grow louder, and prices rose sharply. Gold became markedly more expensive in 2025,⁵ while diamond prices followed a very different path. Rapaport recorded a 24.1% decline in 2025 for round, one-carat natural diamonds in the D–H color, SI clarity category; wholesale prices for lab-grown diamonds have also been falling. So why do so many brands keep raising their prices to the point that their pieces feel almost prohibitively expensive, even as some of their materials become less costly?¹","There is a measurable gap in jewelry itself. In Tiffany & Co.’s Form 10-K for the fiscal year ended January 31, 2020, its last full-year filing as a standalone public company, it reported $4.424 billion in sales against $1.662 billion in cost of sales. Its sales were almost three times that cost, which already included metals, stones, manufacturing labor and overhead, and distribution.² Analysts have also estimated that gold can represent as little as 5% of sales at the very high end of designer jewelry.³ These figures make it even harder for me to accept the retail prices of established luxury houses, especially when some diamond categories have become less expensive. Yes, design, skill, and service have real value. But how much are we willing to pay for the name alone?","Then the 2024 Milan investigation into Dior handbag subcontractors brought another question into focus: Are luxury goods whose prices rise each year really made with the care and refinement those prices imply? Reuters reported a case in which a Dior handbag retailing for €2,600 was supplied to Dior for just €53. Dior was not criminally charged, but its Italian manufacturing subsidiary was placed under court administration.⁴ Dior may not be the only house whose supply chain deserves a closer look. The case left me wondering how widely the gap between the boutique and the workshop extends across luxury.","As a lifelong lover of diamonds and collector of luxury pieces, I remain drawn to the beauty, imagination, and enduring quality of the great houses. I also believe that the relationship between beauty and price should make sense. I founded Atelier Tamara de Launay for those who share that belief: a discerning modern royalty who value exceptional design without needing a logo to announce it. Together, we create pieces worthy of being kept and worn for a lifetime, distinguished by the choice of stone, the precision of their making, and the care that accompanies them. Every gemstone and material is selected with intention; every price is one we can explain with confidence."],"sourceTitle":"Sources","collectionLead":"Fine jewelry in natural and lab-grown diamonds and gemstones, chosen with care.","collectionText":"Nine diamond pieces: the white-gold tennis bracelet and both halo rings are 14K gold; the remaining six pieces are 18K gold. Choose natural or lab-grown diamonds for any design. Editorial images are visualizations; final details are confirmed in your individual proposal.","pricePending":"Price on request","from":"Opening collection · From USD 2,500","productNames":["Onde de Launay","Céleste de Launay — Radiant","Céleste de Launay — Round"],"productTypes":["18K yellow-gold pear diamond bracelet","14K gold radiant halo diamond ring","14K gold round halo diamond ring"],"bespokeLead":"Your imagination, brought to life.","bespokeInvitation":"You do not need a finished design. An image you cannot quite place or a feeling you want to capture is enough. Your story and imagination are where the bespoke design begins.","bespokeText":"Every bespoke piece begins with a private, one-to-one consultation. We listen to your ideas, how you wish to wear the piece, your budget, and your timeline, then create jewelry for you alone. Commissions can begin at USD 3,000 and exceed USD 1 million. Together we consider the stones, design, and craftsmanship; each proposal is developed individually and priced on request.","steps":[["Conversation","Tell us what you imagine, how you wish to wear it, and when you would like it."],["Stone & design","We explore natural and lab-grown diamonds and colored gemstones, proportions, settings, and a considered proposal."],["Creation","Your piece takes shape with care. We share the process and discuss the timing with you."]],"diamondTitle":"The stones are your choice","diamondText":"We work with both natural and lab-grown diamonds and colored gemstones. We disclose each stone’s origin, discuss its individual qualities, and select for the highest quality your budget and timeline allow.","por":"Price on request","tamaraRole":"Founder / CEO","lionelRole":"Buyer / CFO","founderLead":"Two perspectives. One atelier.","tamara":"Tamara T. H. Kim (김태희) grew up among designer pieces, but the jewelry that stayed with her was usually a gift from someone she loved. She learned to see it first as part of a family story and a personal style, long before she thought of it as a label. A lifelong diamond lover and collector, she still delights in the beauty and imagination of the great houses. She also believes a piece should reward a closer look at its stones, making, and price.","tamaraCareer":"Tamara is a Triple Hoya, with a BA, JD, and LLM from Georgetown University. A US attorney with ten years of experience, she built her career in international corporate law and later took on legal and brand leadership roles. Her work has taken her from private practice in Washington, DC and Tokyo to executive responsibilities in Korea. Fluent in Korean, English, and French, she brings a perspective shaped by several cities and cultures to the atelier.","tamaraVision":"At Atelier Tamara de Launay, Tamara pairs a collector’s eye with a lawyer’s habit of asking what lies behind the claim. She looks for distinctive stones, considered design, and craftsmanship that can stand the test of time. Her ambition is deeply personal: to create the kind of jewelry she would be proud to give someone she loves, with a relationship between beauty and price she can explain.","lionel":"Lionel Paul Philippe Delaunay brings a life of looking closely to the atelier. Raised in Paris, he worked as a chef in kitchens around the world and later advised on menus, experiences that sharpened his attention to provenance, proportion, and the smallest finishing detail. He has also worked as a model and developer, moving comfortably between the visual and technical sides of a creative idea.","lionelMore":"At Atelier Tamara de Launay, Lionel draws on his international relationships to help source exceptional gemstones from around the world. He also helped build this website, bringing the same practical care to how the atelier meets its clients online. Alongside Tamara, he connects the people, places, and details that turn an idea for a piece into something tangible.","formLead":"Your next piece begins with a conversation.","formText":"A sketch of an idea is enough. Tell us what you imagine; we will take it from there.","name":"Name","email":"Email","city":"City","country":"Country","interest":"Jewelry category","preference":"Diamond preference","gemPreference":"Colored gemstone preference","stoneOptions":["Lab-grown","Natural","Open to either","Not applicable"],"categories":["Made-to-order Fine Jewelry","Bespoke High Jewelry"],"budget":"Budget range","message":"Your idea","choose":"Select an option","undecided":"Undecided","submit":"Copy inquiry & open Instagram","formNote":"This form prepares a message on your device. Select the button to copy it, then paste and send it in a DM to @atelier_tamara_de_launay. Nothing is submitted from this page.","success":"Your inquiry is ready to paste into an Instagram DM.","policy":"This website does not collect or store form submissions. Consultation details can be copied for an Instagram DM. Please do not send sensitive personal information. External links, including Instagram and cited publications, have their own privacy practices.","termsText":"Collection illustrations, descriptions, and prices are provisional. No purchase is completed on this website. Any bespoke scope, timing, material specifications, and price will be agreed individually before an order is placed.","budgetOptions":["Under USD 1,000","USD 1,000–2,999","USD 3,000–4,999","USD 5,000–6,999","USD 7,000–9,999","USD 10,000–99,999","USD 100,000–999,999","USD 1,000,000+"],"location":"Location","optional":"Optional details","messagePlaceholder":"Tell us what you dream of creating, or which piece caught your eye.","legalLead":"Please read these details before making an inquiry or commissioning a piece."},"ko":{"heroTitle":"불합리한 브랜드 프리미엄을 덜어낸 파인 주얼리.","heroStatement":"오래도록 꿈꿔 온 주얼리가 언젠가 당신만의 시그니처 조합이 되고, 다음 세대에 물려줄 유산이 될지도 모릅니다. 아뜰리에 타마라 드 로네는 천연 혹은 랩그로운 다이아몬드와 유색 보석으로 오직 당신 한 분만을 위한 꿈의 주얼리를 만듭니다. 파리에서 서울까지, 오직 당신을 위해.","statement":"오래도록 꿈꿔 온 주얼리가 언젠가 당신만의 시그니처 조합이 되고, 다음 세대에 물려줄 유산이 될지도 모릅니다. 아뜰리에 타마라 드 로네는 천연 혹은 랩그로운 다이아몬드와 유색 보석으로 오직 당신 한 분만을 위한 꿈의 주얼리를 만듭니다. 파리에서 서울까지, 오직 당신을 위해.","homeEyebrow":"파리에서 서울까지<br>전 세계 배송","introTitle":"다음 세기로 이어질 유산, 당신과 함께 시작합니다.","intro":"저희는 주얼리의 가치를 소재와 세공에서 찾도록 배웠습니다. 천연 혹은 랩그로운 다이아몬드와 유색 보석을 모두 다루며, 보석의 품질부터 디자인과 제작, 서비스까지 세심하게 살핍니다. 모든 보석은 직접 엄선하고, 모든 작품은 평생 곁에 두었다가 언젠가 다음 세대에 물려줄 수 있도록 만듭니다.","homeBespoke":"당신의 시간과 예산에 맞춘 1:1 맞춤제작 주얼리.","homeBespokeText":"1:1 프라이빗 컨설팅으로 완성하는 수천 달러대의 비스포크 피스부터 수백만 달러 규모의 하이 주얼리까지, 모든 제안은 당신만의 고유한 비전과 예산, 일정에 맞추어 설계됩니다. 마음속에 품어온 아름다움에 대해 자유롭게 이야기를 들려주세요. 영원히 간직될 단 하나의 작품으로 온전히 구현해 드립니다.","storyLead":"김태희 대표가 직접 전하는 이야기","storyP":["저는 어릴 때부터 명품에 둘러싸여 자랐고, 사랑하는 사람들에게 받은 주얼리를 자랑스럽게 착용했습니다. 제게 명품과 주얼리는 브랜드의 상징이기 전에 저만의 스타일에 즐거움을 더하는 물건이었습니다.","하지만 오랜 해외 생활을 마치고 귀국해 한국에서 지내면서 의문이 생겼습니다. 서울 어디에서나 판에 찍은 듯 비슷한 명품 브랜드의 로고와 상징적 모티프가 눈에 들어왔고, 판매가는 논리가 따라가기 어려울 만큼 빠르고 가파르게 올랐습니다. 2025년에는 금값이 크게 오른 반면⁵ 일부 다이아몬드의 가격은 급격히 하락했습니다. Rapaport에 따르면 D–H 색상·SI 투명도 등급의 1캐럿 라운드 천연 다이아몬드는 2025년 가격이 24.1% 하락했고, 랩그로운 다이아몬드의 도매가격도 하락세였습니다. 이렇게 원재료 중 가격이 대폭 하락한 항목이 있는데도, 명품 주얼리의 가격은 왜 계속 하늘 높은 줄 모르고 오르는 걸까요?¹","주얼리 업계의 공시에서도 가격과 원가의 차이를 확인할 수 있습니다. 티파니앤코가 독립 상장회사로서 2020년 1월 31일 종료 회계연도에 제출한 마지막 Form 10-K 연간 보고서에 따르면 매출은 44억 2,400만 달러, 매출원가는 16억 6,200만 달러였습니다. 금속과 보석, 제작 인건비, 제조 간접비와 유통비가 포함된 매출원가에 비해 회사 전체 매출이 약 2.66배였던 셈입니다.² 최고급 명품 주얼리의 판매가에서 금 원재료비가 차지하는 비중은 고작 5% 수준일 수 있다는 애널리스트의 추정도 있습니다.³ 이런 수치를 들여다볼수록, 명품 브랜드의 가격을 선뜻 받아들이기 어려워집니다.<br><br>물론 디자인과 장인의 기술, 서비스에는 분명한 가치가 있습니다. 하지만 매년 최고가를 경신하는 판매가 속에서, 실제 품질과 무관하게 오직 브랜드 이름을 위해 지불하는 몫은 얼마나 될까요?","2024년 밀라노의 디올 핸드백 하청업체 조사에서는 또 다른 질문이 떠올랐습니다. 과연 매년 가격이 오르는 명품은 그 가격에 상응하는 세심하고 고급스러운 제작 과정을 거치고 있을까요? 로이터는 소매가 2,600유로에 판매되는 디올 가방이 실제로는 공급업체로부터 단돈 53유로에 납품된 사례를 보도했습니다. 디올은 형사 기소되지 않았지만, 이탈리아 제조 자회사는 법원의 관리 대상이 됐습니다.⁴ 디올만의 일일까요? 이 사건을 계기로 명품 업계의 매장과 제작 현장 사이에 얼마나 큰 거리가 있는지 생각하게 됐습니다.","저는 평생 아름다운 것을 사랑하며 보석과 명품을 수집해 왔습니다. 지금도 명품 브랜드가 선보이는 아름다움과 창의성, 오래가는 품질을 공부하고 그 장인정신에 매료되곤 합니다. 그렇기에 더욱, 손에 넣을 수 있는 아름다움과 그에 지불하는 가격 사이에는 납득할 만한 균형이 있어야 한다고 믿습니다. 같은 생각을 가진 깨어 있는 소비자, 이 이야기에 고개를 끄덕이는 분들을 위해 아뜰리에 타마라 드 로네(Atelier Tamara de Launay)를 창립했습니다. 이미 널리 알려진 로고보다 희소성 있는 디자인, 세심하게 엄선한 원석의 색과 빛을 먼저 알아봐 주시는 분들을 위해 존재하는 아뜰리에입니다.<br><br>제가 바라는 것은 좋은 보석을 매의 눈으로 고르고, 정교한 제작과 세심한 서비스로 완성해 고객님이 평생 기쁘게 착용하시다가 다음 세대에 자신 있게 물려주실 수 있는 주얼리를 만드는 일입니다. 소재의 선택에는 이유가 있어야 하고, 그 품질과 판매가의 관계도 자신 있게 설명할 수 있어야 합니다. 이것이 제 신조입니다."],"sourceTitle":"출처","collectionLead":"천연 혹은 랩그로운 다이아몬드와 유색 보석을 세심하게 골라 완성한 파인 주얼리.","collectionText":"오프닝 컬렉션의 아홉 점은 모두 다이아몬드 주얼리입니다. 화이트 골드 테니스 브레이슬릿과 두 헤일로 링은 14K 골드, 나머지 여섯 점은 18K 골드로 제작합니다. 모든 디자인에 천연 혹은 랩그로운 다이아몬드를 선택하실 수 있습니다. 연출 이미지는 작품의 분위기를 보여주며, 최종 사양은 개별 제안서에서 확인하실 수 있습니다.","pricePending":"가격 문의","from":"오프닝 컬렉션 · 2,500달러부터","productNames":["Onde de Launay","셀레스트 드 로네 — 래디언트","셀레스트 드 로네 — 라운드"],"productTypes":["18K 옐로 골드 페어 다이아몬드 브레이슬릿","14K 골드 래디언트 헤일로 다이아몬드 링","14K 골드 라운드 헤일로 다이아몬드 링"],"bespokeLead":"상상하던 주얼리를 현실로.","bespokeInvitation":"아직 구체적인 디자인이 없어도 좋습니다. 막연히 떠오르는 이미지나 원하는 분위기만으로도 충분합니다. 당신의 상상과 이야기에서 비스포크 디자인이 시작됩니다.","bespokeText":"1:1 고객 상담에서 취향과 착용 방식, 예산과 일정을 충분히 듣고, 단 한 분만을 위한 맞춤 주얼리를 제작합니다. 1:1 맞춤제작 주얼리는 3,000달러부터 시작하며, 100만 달러가 넘는 하이 주얼리까지 가능합니다. 상담 내용을 바탕으로 보석과 디자인, 제작 방식을 제안하며, 작품별 구성과 가격은 개별적으로 안내합니다.","steps":[["상담","1:1 상담에서 취향과 원하시는 디자인, 착용 방식, 예산과 완성 시기를 들려주세요."],["보석과 디자인","천연 혹은 랩그로운 다이아몬드와 유색 보석을 살펴보고, 크기와 비율, 세팅을 함께 논의합니다."],["제작","합의한 일정에 따라 작품을 제작하고 진행 과정을 알려드립니다."]],"diamondTitle":"보석의 선택은 당신에게 있습니다","diamondText":"천연 혹은 랩그로운 다이아몬드와 유색 보석을 모두 다룹니다. 각 보석의 출처와 특성을 설명드리고, 예산과 일정에 맞는 최선의 선택을 함께 찾습니다.","por":"가격 문의","tamaraRole":"창립자 / CEO","lionelRole":"바이어 / CFO","founderLead":"서로 다른 경험이 하나의 아뜰리에에서 만났습니다.","tamara":"김태희 대표는 어린 시절부터 명품과 주얼리를 가까이에서 접했습니다. 하지만 오래도록 마음에 남은 제품들은 대부분 사랑하는 사람에게 받은 선물이었습니다. 그렇게 주얼리를 브랜드의 상징보다 인간적인 추억과 개인의 취향이 담긴 작품으로 바라보게 됐습니다. 오랫동안 다이아몬드와 유색 보석을 사랑하고 수집해 온 김태희 대표는 명품 브랜드의 가격 거품 없이 소재와 제작 방식, 가격까지 납득할 수 있는 최고 품질의 데일리 주얼리를 만들고자 합니다.","tamaraCareer":"김태희 대표는 조지타운대학교에서 학사(BA), 법학전문석사(JD), 법학석사(LLM)를 모두 취득한 ‘트리플 호야(Triple Hoya)’입니다. 10년 차 미국 변호사로서 국제 기업법 분야에서 경력을 쌓았으며, 이후 법무와 브랜딩을 아우르는 업무를 맡았습니다. 워싱턴 DC와 도쿄의 로펌에서 일했고 한국에서는 최연소 임원으로 활동했습니다. 한국어, 영어, 프랑스어를 구사하며 여러 문화권에서 쌓은 경험을 아뜰리에 타마라 드 로네에 담았습니다.","tamaraVision":"김태희 대표는 컬렉터의 안목과 변호사로서 근거를 꼼꼼히 살피는 태도를 주얼리에도 적용합니다. 개성 있는 보석을 고르고 디자인과 세공의 작은 차이까지 살핍니다. 사랑하는 사람에게 기꺼이 선물하고 평생 행복하게 착용할 수 있는, 아름다움과 가격 모두에 이유가 있는 주얼리를 만들고자 합니다.","lionel":"리오넬 폴 필리프 드로네(Lionel Paul Philippe Delaunay)는 섬세한 관찰력과 폭넓은 경험을 아뜰리에에 더합니다. 파리에서 자란 그는 세계 여러 나라의 주방에서 셰프로 일했고, 이후 메뉴 컨설턴트로 활동했습니다. 재료의 산지와 조화, 마무리의 작은 차이를 보는 안목을 그 과정에서 길렀습니다. 모델과 개발자로도 일하며 시각적 감각과 기술적인 역량을 쌓았습니다.","lionelMore":"리오넬은 세계 곳곳에서 쌓은 인연을 바탕으로 뛰어난 보석을 찾습니다. 이 웹사이트 제작에도 참여해 고객이 온라인에서 아뜰리에를 만나는 경험을 함께 만들었습니다. 김태희 대표와 함께 보석을 고르고 세부 사항을 조율하며, 고객이 꿈꾸는 주얼리를 실제 작품으로 완성해 갑니다.","formLead":"당신만의 주얼리, 한 문장에서 시작됩니다.","formText":"아직 구체적인 디자인이 없어도 괜찮습니다. 마음속에 그려온 모습을 들려주세요.","name":"이름","email":"이메일","city":"도시","country":"국가","interest":"주얼리 종류","preference":"다이아몬드 종류","gemPreference":"유색 보석 종류","stoneOptions":["랩그로운","천연","둘 다 가능","해당 없음"],"categories":["주문제작 파인 주얼리","비스포크 하이 주얼리"],"budget":"예산 (USD)","message":"꿈꾸는 주얼리","choose":"선택해 주세요","undecided":"미정","submit":"문의 내용 복사 후 인스타그램 열기","formNote":"버튼을 누르면 이 기기에서 내용이 복사됩니다. 인스타그램 DM에 붙여넣어 직접 보내주세요. 이 페이지에서 문의가 자동 전송되지는 않습니다.","success":"문의 내용을 복사했습니다. 인스타그램 DM에 붙여넣어 보내주세요.","policy":"이 사이트는 문의 양식에 입력한 내용을 수집하거나 저장하지 않습니다. 입력 내용을 복사해 인스타그램 DM으로 보내실 수 있습니다. 민감한 개인정보는 보내지 마세요. 외부 링크에는 해당 서비스의 개인정보 처리방침이 적용됩니다.","termsText":"컬렉션의 연출 이미지와 설명, 가격은 안내용이며 변경될 수 있습니다. 이 사이트에서는 결제가 이루어지지 않습니다. 1:1 맞춤제작 주얼리의 범위와 일정, 소재, 가격은 주문 전에 개별적으로 협의합니다.","budgetOptions":["1,000달러 미만","1,000~2,999달러","3,000~4,999달러","5,000~6,999달러","7,000~9,999달러","10,000~99,999달러","100,000~999,999달러","1,000,000달러 이상"],"location":"지역","optional":"추가 선택 사항","messagePlaceholder":"꿈꾸는 주얼리나 마음에 드는 작품을 편하게 들려주세요.","legalLead":"문의 또는 주문 전에 아래 내용을 확인해 주세요."}};
const signatures={"en":{"heading":"Explore the opening collection","lead":"Nine diamond pieces, presented in warm and cool tones. The Ligne de Lumière tennis bracelet and both Céleste de Launay rings are 14K gold; the remaining six pieces are 18K gold. Choose natural or lab-grown diamonds for any design. For availability or a private commission, DM us anytime.","groups":["Warm tones","Cool tones"],"inquire":"Enquire on Instagram","concepts":"Explore the rest of the collection","items":[["Fleur de Launay — Pendant","18K yellow-gold floral diamond necklace","Pear-shaped diamonds form a flower pendant on a delicate gold chain."],["Fleur de Launay — Ring","18K yellow-gold floral diamond ring","A sculptural flower of pear-shaped diamonds, paired with the pendant."],["Éternelle de Launay","18K yellow-gold diamond eternity ring","A continuous circle of diamonds, made to be worn every day."],["L’Amour de Tamara — Pear","18K gold pink pear diamond ring","A pear-shaped pink diamond framed by a sweep of white diamonds."],["L’Amour de Tamara — Radiant","18K gold pink radiant diamond ring","A pink radiant-cut diamond, flanked by white diamonds."],["Ligne de Lumière","14K white-gold diamond tennis bracelet","A clean line of white diamonds with a cool, even brilliance."]]},"ko":{"heading":"오프닝 컬렉션 둘러보기","lead":"다이아몬드 주얼리 아홉 점을 웜톤과 쿨톤으로 선보입니다. Ligne de Lumière 테니스 브레이슬릿과 Céleste de Launay 링 두 점은 14K 골드, 나머지 여섯 점은 18K 골드입니다. 모든 디자인에 천연 혹은 랩그로운 다이아몬드를 선택하실 수 있습니다. 주문 가능 여부와 1:1 맞춤제작 상담은 언제든 인스타그램 DM으로 문의해 주세요.","groups":["웜톤","쿨톤"],"inquire":"인스타그램 DM 문의","concepts":"컬렉션의 다른 작품","items":[["Fleur de Launay — 목걸이","18K 옐로 골드 플라워 다이아몬드 목걸이","물방울 모양의 다이아몬드가 꽃을 이루는 펜던트 목걸이."],["Fleur de Launay — 반지","18K 옐로 골드 플라워 다이아몬드 링","목걸이와 한 세트를 이루는 플라워 링."],["Éternelle de Launay","18K 옐로 골드 다이아몬드 이터니티 링","다이아몬드가 끊임없이 이어지는 이터니티 링."],["L’Amour de Tamara — 페어","18K 골드 핑크 페어 다이아몬드 링","핑크빛 물방울 모양 다이아몬드를 화이트 다이아몬드가 감싸는 링."],["L’Amour de Tamara — 래디언트","18K 골드 핑크 래디언트 다이아몬드 링","핑크빛 래디언트 컷 다이아몬드와 화이트 다이아몬드가 어우러진 링."],["Ligne de Lumière","14K 화이트 골드 다이아몬드 테니스 브레이슬릿","화이트 다이아몬드가 가지런히 이어지는 테니스 브레이슬릿."]]}};
const legalCopy={"en":[["Business information","Registered business name: 아뜰리에 타마라 드 로네 (Atelier Tamara de Launay). Representative: 김태희 (Tamara T. H. Kim). Korean business registration number: 199-02-04431."],["Terms of use","The website presents Atelier Tamara de Launay’s jewelry and invites private inquiries. Browsing, adding a piece to the cart, using the form, or sending an inquiry does not place an order or reserve a piece. The cart prepares a nonbinding request. No payment is taken on this site; a bank transfer is requested only after an individual written quote and verified account details are provided."],["Images, materials & prices","Editorial images may be AI-assisted visualizations and can differ from the finished piece. Descriptions, carat and gold weights, stone counts, sizes, availability, and displayed “From” prices are estimates or starting indications. A selected natural or lab-grown option does not automatically recalculate the displayed price. The final stone origin, grading or certification if applicable, specifications, availability, delivery, shipping costs, duties, taxes, and price must be confirmed in a written proposal before you order."],["Advance payment protection","For a prepaid order shipped to a consumer in Korea, you may choose an available payment escrow arrangement or an applicable consumer damage compensation insurance arrangement before transferring funds. If you choose either protection, we will arrange its use or conclude the applicable contract as required by Korean law and explain the provider, procedure, and any applicable exception in the individual written quote. Please tell us your choice before making any bank transfer; do not send payment until the arrangement and verified account details are confirmed."],["Commissions & orders","For a custom commission, the design, materials, budget, timetable, payment schedule, changes, cancellation or return terms, and any care or service commitments will be set out individually before an order is accepted. A conversation or proposal is not a guarantee of a stone, price, delivery date, or finished appearance. Any consumer rights that apply under the law governing a particular purchase remain in effect; nothing here excludes them."],["Made-to-order pieces, exchanges & returns","Every piece, including the fine jewelry collection, is made for one client to the specifications confirmed in the individual order; we do not maintain finished stock for ordinary resale. Once production has begun, we generally cannot accept an exchange, cancellation, or return for a change of mind where applicable law permits that restriction. Before accepting payment, we will separately notify you of any legally applicable withdrawal restriction and obtain your express written or electronic consent where required. An order-specific notice and consent do not remove rights arising from a defect, damage, incorrect specifications, or other rights that cannot legally be waived. Contact us promptly if there is a problem so we can arrange the remedy required by law and the confirmed order."],["Lifetime care & workmanship warranty","While the atelier remains in business, owners of our fine jewelry and bespoke pieces may request complimentary routine prong inspection, professional cleaning, and setting verification. We also warrant defects in our workmanship for the life of the piece and will remedy a confirmed workmanship defect without charge. Please contact us before sending a piece so we can assess and arrange service. Accidental damage, loss, ordinary wear, misuse, and alterations or repairs by others are outside this voluntary warranty; any additional repair or replacement and shipping costs will be quoted before work begins. This promise is in addition to, and does not limit, rights under applicable consumer law."],["Website content & external services","Site photographs, text, designs, and brand marks are for personal viewing and may not be copied for commercial use without permission. Links to Instagram and outside sources take you to services with their own terms and privacy practices. The website is provided for general information; to the extent the law permits, the atelier is not responsible for interruptions or errors outside its reasonable control. This does not limit rights that cannot lawfully be limited."],["Privacy & inquiries","The inquiry and cart request forms work in your browser. They do not transmit the fields to Atelier Tamara de Launay or store a submission on this website. Clicking the button attempts to copy your details on your device and opens Instagram; you decide whether to paste and send the message. If you send a DM, the atelier receives the name, contact details, location, preferences, budget, and message you choose to include and uses them to respond, discuss a proposal, and manage your inquiry. Please avoid sensitive information in the message."],["Browser choices & third parties","The site stores your language selection and cart contents in your browser’s local storage. Cart contents stay on your device unless you choose to send the prepared request. The hosting provider may process routine technical data needed to deliver and secure the site. The site loads Google Fonts, and Instagram or linked publications may process information under their own notices when you visit them. We do not sell inquiry details through this website."],["Your choices & contact","You may request access, correction, or deletion of information you have sent to the atelier by messaging @atelier_tamara_de_launay on Instagram. We handle such requests subject to applicable legal obligations and retain inquiry correspondence only as reasonably needed for the inquiry, any subsequent relationship, and legal requirements. If a transaction proceeds, a separate written order may provide further privacy and purchase information. This notice may be updated; the date at the top of this page shows the current version."]],"ko":[["사업자 정보","상호: 아뜰리에 타마라 드 로네 · 대표자: 김태희 · 사업자등록번호: 199-02-04431"],["사이트 이용","이 사이트는 Atelier Tamara de Launay의 주얼리를 소개하고 1:1 문의를 받기 위한 공간입니다. 사이트 열람, 장바구니 담기, 문의 양식 작성 또는 DM 발송만으로 주문이나 예약이 성립하지 않습니다. 장바구니는 주문 요청 문구를 준비하는 기능입니다. 이 사이트에서는 결제가 진행되지 않으며, 계좌이체는 개별 서면 견적과 확인된 입금 계좌를 안내받은 뒤 진행합니다."],["이미지·소재·가격","연출 이미지에는 AI를 활용한 시각화가 포함될 수 있으며 실제 완성품과 차이가 있을 수 있습니다. 제품 설명, 캐럿 및 골드 중량, 보석 개수, 크기, 재고, ‘시작가’는 추정치 또는 안내용 기준입니다. 천연 혹은 랩그로운 선택만으로 표시된 시작가가 자동 변경되지는 않습니다. 주문 전 보석의 출처, 해당하는 경우 감정서 또는 등급, 최종 사양, 재고, 배송·관세·세금 및 확정 가격을 서면 제안으로 안내합니다."],["선지급 결제 보호 선택","한국 소비자에게 배송되는 선지급식 통신판매 주문에서는 결제대금예치(에스크로) 또는 소비자피해보상보험계약등의 이용·체결을 선택하실 수 있습니다. 이를 선택하시면 관련 법령에 따라 해당 제도를 이용할 수 있게 하거나 계약을 체결하고, 제공 기관·이용 절차 및 적용 가능한 예외를 개별 서면 견적에서 안내합니다. 계좌이체 전에 원하시는 방식을 알려주세요. 보호 방식과 확인된 계좌 정보가 확정되기 전에는 입금하지 마세요."],["맞춤제작과 주문","1:1 맞춤제작 주얼리의 디자인, 소재, 예산, 일정, 결제, 변경·취소·반품 조건, 관리 및 사후 서비스는 주문 전 개별적으로 협의해 서면으로 확정합니다. 상담이나 제안만으로 특정 보석, 가격, 납기 또는 완성품의 외관이 보장되지는 않습니다. 실제 거래에 적용되는 소비자 권리는 관련 법령에 따르며, 이 안내가 법률상 권리를 제한하지 않습니다."],["주문제작 상품의 교환·환불","파인주얼리 컬렉션을 포함한 모든 작품은 완제품 재고를 출고하는 방식이 아니라, 주문을 확정한 고객 한 분을 위해 선택한 사양에 맞춰 제작합니다. 제작이 시작된 뒤에는 단순 변심에 따른 취소·교환·반품을 원칙적으로 받지 않으며, 이 제한은 관련 법률이 허용하는 범위에서만 적용됩니다. 주문·결제 전 청약철회 제한이 적용되는 경우 그 사실을 별도로 안내하고, 법에서 요구하는 서면 또는 전자문서 동의를 받습니다. 제품의 하자·파손, 주문 내용과 다른 제작·배송 등 법률상 보장되는 권리는 제한되지 않습니다. 문제가 있다면 신속히 연락해 주세요. 관련 법령과 확정된 주문 조건에 따라 조치하겠습니다."],["평생 관리 및 제작 품질 보증","아뜰리에가 영업하는 동안 파인주얼리와 비스포크 작품에 정기적인 발물림 점검, 전문 세척, 세팅 상태 확인을 무료로 제공합니다. 작품의 제작상 결함은 평생 보증하며, 확인된 제작상 결함은 무료로 조치합니다. 작품을 보내시기 전에 먼저 연락해 점검과 접수 방법을 안내받으세요. 사고로 인한 손상, 분실, 통상적인 사용에 따른 마모, 부적절한 사용, 제삼자의 수리·변경은 이 자발적 보증의 대상이 아닙니다. 추가 수리·교체와 배송 비용이 있다면 작업 전에 견적을 안내합니다. 이 약속은 관련 법률상 소비자 권리에 더해 제공되며 이를 제한하지 않습니다."],["콘텐츠와 외부 서비스","사진, 글, 디자인, 상표와 로고는 개인적인 열람을 위한 것이며 허락 없이 상업적으로 복제할 수 없습니다. 인스타그램과 외부 출처 링크에는 해당 서비스의 약관과 개인정보 처리방침이 적용됩니다. 법률이 허용하는 범위에서, 아뜰리에가 합리적으로 통제할 수 없는 접속 장애나 오류에 관한 책임은 제한됩니다. 법률상 제한할 수 없는 권리에는 영향을 주지 않습니다."],["개인정보와 문의","문의 양식과 장바구니 요청은 방문자의 브라우저에서 작동합니다. 입력 내용은 이 사이트에서 아뜰리에로 자동 전송되거나 문의 기록으로 저장되지 않습니다. 버튼을 누르면 기기에서 내용을 복사하고 인스타그램을 엽니다. DM에 붙여넣어 실제로 보낼지는 방문자가 결정합니다. DM을 보내시면 아뜰리에는 제공하신 이름, 연락처, 지역, 선호 사항, 예산과 메시지를 받아 상담과 제안, 문의 관리에 사용합니다. 민감한 정보는 보내지 말아 주세요."],["브라우저 설정과 외부 서비스","이 사이트는 선택하신 언어와 장바구니 내용을 브라우저의 로컬 저장소에 기억합니다. 장바구니 내용은 준비된 요청을 직접 보내기 전까지 기기에만 남습니다. 호스팅 서비스는 사이트 제공과 보안에 필요한 일반적인 기술 정보를 처리할 수 있습니다. 사이트는 Google Fonts를 불러오며, 인스타그램이나 외부 링크를 방문하면 해당 서비스가 자체 방침에 따라 정보를 처리할 수 있습니다. 이 사이트를 통해 문의 정보를 판매하지 않습니다."],["열람·정정·삭제 요청","아뜰리에에 보내신 정보의 열람, 정정 또는 삭제를 원하시면 인스타그램 @atelier_tamara_de_launay로 연락해 주세요. 관련 법률상 의무를 고려해 요청을 처리하며, 문의 기록은 상담, 이후 거래 관계 및 법적 의무에 합리적으로 필요한 범위에서 보관합니다. 실제 주문이 진행될 경우 별도의 서면 주문 조건과 개인정보 안내를 제공할 수 있습니다. 이 안내의 최종 수정일은 페이지 상단에 표시되어 있으며, 이후 내용이 변경될 수 있습니다."]]};

function choiceGroup(name,label,options,id,selected){return `<fieldset class="diamond-choice"><legend>${label}</legend><div class="stone-options">${options.map(([value,title])=>`<label class="stone-choice"><input type="radio" name="${name}-${id}" value="${value}" ${value===selected?'checked':''}><span>${title}</span></label>`).join('')}</div></fieldset>`}
function catalogDetails(spec,id){const t=catalogLabels[lang],o=jewelryOptions[lang];const rows=[['diamond',spec.total],['center',spec.center],['melee',spec.melee],['pieces',spec.pieces],['goldWeight',spec.goldWeight]].filter(([,value])=>value!==undefined).map(([key,value])=>`<li><span>${t[key]}</span><strong>${value}</strong></li>`).join('');return `<div class="catalog-details"><p class="catalog-price">${spec.price?`${t.starts} USD ${spec.price.toLocaleString('en-US')}`:t.request}</p><p class="catalog-metal">${spec.gold} ${t.gold}</p>${rows?`<ul>${rows}</ul>`:`<p class="spec-pending">${lang==='ko'?'캐럿·골드 중량은 개별 문의 시 안내합니다.':'Carat and gold weights are confirmed on inquiry.'}</p>`}<div class="jewelry-choices">${choiceGroup('diamond-origin',o.origin,[['lab-grown',o.lab],['natural',o.natural]],id,'lab-grown')}${choiceGroup('diamond-color',o.colors,o.diamond,id,picturedColor[Number(id.split('-')[1])])}${choiceGroup('gold-color',o.metals,[['pictured',lang==='ko'?'사진 속 구성':'As photographed'],...o.gold],id,picturedGold[Number(id.split('-')[1])])}<p class="choice-hint">${o.hint}</p><p class="natural-premium" id="natural-premium-${id}" hidden>${lang==='ko'?'천연 다이아몬드는 추가 비용이 발생합니다. 정확한 가격은 문의해 주세요.':'Natural diamonds incur an additional cost. Please inquire for an individual quote.'}</p></div></div>`}

const productPageCopy={en:{back:'Back to the collection',view:'View piece',discuss:'Discuss this piece',details:'The piece',origin:'Select your preferred diamond',note:'Editorial visualization. Specifications and starting prices are approximate; the final proposal depends on the chosen diamonds and details.',moreDescriptions:['A flowing sequence of pear-shaped diamonds in yellow gold.','A radiant-cut center framed by a halo of diamonds.','A round center framed by a halo of diamonds.']},ko:{back:'컬렉션으로 돌아가기',view:'작품 자세히 보기',discuss:'이 작품 상담하기',details:'작품 정보',origin:'다이아몬드 종류 선택',note:'연출 이미지는 작품의 분위기를 보여줍니다. 사양과 시작 가격은 대략적인 안내이며, 최종 조건은 선택하신 다이아몬드와 사양에 따라 개별적으로 확정됩니다.',moreDescriptions:['물방울 모양 다이아몬드가 옐로 골드를 따라 흐르듯 이어지는 브레이슬릿.','래디언트 컷 중심석을 다이아몬드 헤일로가 감싸는 링.','라운드 중심석을 다이아몬드 헤일로가 감싸는 링.']}};
function productRecord(n){const si=collectionIndex.signature.indexOf(n);if(si>=0){const [name,type,description]=signatures[lang].items[si];return {name,type,description,spec:catalogSpecs.signature[si],n}}const ci=collectionIndex.more.indexOf(n);if(ci>=0)return {name:copy[lang].productNames[ci],type:copy[lang].productTypes[ci],description:productPageCopy[lang].moreDescriptions[ci],spec:catalogSpecs.concept[ci],n};return null}
const ringIds=new Set([4,5,6,7,8,9]);
const ringCopy={en:{label:'Ring size · finger circumference',guide:'Size chart & how to measure',unsure:'I am not sure — please advise',note:'Select a finger circumference in millimetres. We will confirm the fit before making your ring.',title:'Find your ring size',intro:'Use the circumference of the finger on which you will wear the ring. The table is a guide; we will confirm sizing with you before production.',steps:['Wrap a narrow strip of paper around the base of that finger, comfortably snug and able to pass the knuckle. Mark where the ends meet.','Lay the strip flat and measure to the mark in millimetres. Repeat at the end of the day, when fingers are warmer.','If you have a ring that fits, measure its inside diameter straight across. Compare it with the approximate diameter below.'],circ:'Finger circumference',diam:'Inside diameter',foot:'Approximate measurements. For a wide band or a size between entries, request fitting advice.',source:'Ring measurement guidance: GIA and Cartier.',close:'Close',variant:'Ring size'},ko:{label:'반지 사이즈 · 손가락 둘레',guide:'사이즈표와 재는 법',unsure:'사이즈를 모르겠어요 · 상담 후 결정',note:'착용하실 손가락의 둘레(mm)를 선택해 주세요. 제작 전 사이즈를 다시 확인합니다.',title:'반지 사이즈 가이드',intro:'반지를 착용할 손가락의 둘레를 기준으로 선택해 주세요. 아래 수치는 참고용이며 제작 전 상담을 통해 확인합니다.',steps:['얇은 종이 띠를 착용할 손가락 밑부분에 감습니다. 마디를 통과할 수 있을 정도로 편안하게 맞춘 뒤 겹치는 지점을 표시하세요.','종이를 펴서 끝에서 표시한 지점까지의 길이를 밀리미터로 잽니다. 손가락이 따뜻한 저녁에 한 번 더 재보세요.','잘 맞는 반지가 있다면 반지 안쪽의 지름을 가로로 재어 아래 표와 비교할 수도 있습니다.'],circ:'손가락 둘레',diam:'반지 안지름',foot:'표는 대략적인 치수입니다. 폭이 넓은 반지나 중간 사이즈가 필요하다면 상담해 주세요.',source:'측정 방법 참고: GIA 및 까르띠에.',close:'닫기',variant:'반지 사이즈'}};
function ringSizing(n){if(!ringIds.has(n))return '';const t=ringCopy[lang],chart=Array.from({length:13},(_,i)=>44+i*2).map(mm=>`<tr><td>${mm} mm</td><td>${(mm/Math.PI).toFixed(1)} mm</td></tr>`).join('');return `<div class="ring-sizing"><div class="ring-size-heading"><label for="ring-size-${n}">${t.label}</label><button type="button" data-size-guide aria-haspopup="dialog" aria-controls="ring-size-dialog">${t.guide} ↗</button></div><select id="ring-size-${n}" name="ring-size-${n}"><option value="consult">${t.unsure}</option>${Array.from({length:29},(_,i)=>44+i).map(mm=>`<option value="${mm}">${mm} mm</option>`).join('')}</select><p class="ring-size-note">${t.note}</p></div><dialog class="ring-size-dialog" id="ring-size-dialog" aria-labelledby="ring-size-title"><button class="dialog-close" type="button" data-close-size-guide aria-label="${t.close}">×</button><h2 id="ring-size-title">${t.title}</h2><p>${t.intro}</p><span class="ring-guide-visual"><img class="ring-diagram-photo" src="ring-measure-guide.webp" alt="${lang==='ko'?'손 전체와 종이 띠, 자를 이용해 손가락 둘레를 재는 두 단계 그림':'A full hand with a paper strip around the ring finger, then the strip measured against a ruler'}" loading="lazy"></span><ol>${t.steps.map(x=>`<li>${x}</li>`).join('')}</ol><table><thead><tr><th>${t.circ}</th><th>${t.diam}</th></tr></thead><tbody>${chart}</tbody></table><p>${t.foot}</p><p class="guide-source">${t.source} <a href="https://www.gia.edu/quality-assurance-benchmark/accurate-determination-finger-ring-size" target="_blank" rel="noopener">GIA ↗</a></p></dialog>`}
function productDetail(product){const q=productPageCopy[lang],n=product.n;return `<section class="page-hero product-page-heading"><a class="return-link" href="#collection">← ${q.back}</a><span class="eyebrow">Atelier Tamara de Launay</span><h1>${product.name}</h1><p>${product.type}</p></section><article class="container product-detail"><div class="product-detail-gallery"><figure class="product-detail-image"><img id="detail-main" src="collection-${n}-editorial.webp" alt="${product.name}, ${photoLabels[lang]}"></figure><p class="editorial-note">${q.note}</p></div><div class="product-detail-content"><span class="eyebrow">${q.details}</span><h2>${product.name}</h2><p class="product-detail-type">${product.type}</p><p>${product.description}</p>${catalogDetails(product.spec,`detail-${n}`)}${ringSizing(n)}<div class="product-purchase-actions"><button type="button" class="button fill" data-add-to-cart="selected" data-piece="${n}">${lang==='ko'?'선택한 옵션 장바구니 담기':'Add selected options to cart'}</button></div><p class="cart-feedback" id="cart-feedback" role="status" hidden></p><button type="button" class="wish-button" data-wish="${n}" aria-pressed="${readWishlist().includes(n)}">${readWishlist().includes(n)?(lang==='ko'?'♥ 위시리스트에 담김':'♥ Saved to wishlist'):(lang==='ko'?'♡ 위시리스트에 담기':'♡ Add to wishlist')}</button>${sharePanel('piece',n)}<a class="text-link" href="#contact" data-inquire-piece="${n}">${q.discuss}</a></div></article>`}
const picturedColor={1:'white',2:'white',3:'white',4:'white',5:'white',6:'white',7:'white',8:'pink',9:'pink'};

const cartText={en:{title:'Your selection',lead:'Save the pieces and preferences you love. We confirm specifications, availability, and the final amount before any payment.',pictured:'As photographed',confirm:'Confirm diamond origin',quote:'Price upon request',from:'Indicative from',remove:'Remove',empty:'Your cart is waiting for the first piece.',browse:'Explore the collection',checkout:'Request your final quote & bank details',payment:'Bank transfer, after your quote',protection:'Before any advance transfer for delivery to Korea, choose payment escrow or applicable consumer damage compensation insurance. Tell us your choice; we will confirm the arrangement and verified payment details in writing before asking you to pay.',steps:['Review the selected pieces and options.','Send the prepared order request to the atelier.','Receive a written final quote and verified bank details. Transfer payment only after you have checked both.'],name:'Name',email:'Email',prepare:'Copy order request & open Instagram',copyHelp:'This prepares an inquiry on your device. Nothing is paid or ordered by using this page.',copied:'Order request copied. Paste it into a DM to @atelier_tamara_de_launay.',failed:'Automatic copying was unavailable. Copy this request and send it by DM.',added:'Added to your cart.',natural:'Natural diamonds · additional cost; please inquire',notFinal:'Displayed starting amounts are estimates, not a payable total. Shipping and any taxes are confirmed with the quote.',consentTitle:'Made for you',consentNotice:'Every piece is made to the confirmed specifications of one client. After production begins, change-of-mind cancellation, exchange, or return may be restricted only where applicable law allows. Before a binding order and payment, we will provide the final specifications, price, timetable, and a separate order-specific notice and request for written or electronic consent if a withdrawal restriction applies.',consentRights:'Defects, damage, incorrect specifications, and other non-waivable rights remain protected.',consentCheck:'I have read this made-to-order notice and understand that this cart sends only an inquiry. My final order and any legally required separate consent come after the written quote.',consentRecord:'Made-to-order notice read and acknowledged at inquiry stage (not final order consent)'},ko:{title:'장바구니',lead:'마음에 드는 작품과 옵션을 담아두세요. 실제 제작 사양과 재고, 최종 결제금액은 입금 전에 개별적으로 확정합니다.',pictured:'사진 속 구성',confirm:'다이아몬드 종류 상담 시 확정',quote:'가격 문의',from:'안내 시작가',remove:'삭제',empty:'장바구니가 비어 있습니다.',browse:'컬렉션 살펴보기',checkout:'최종 견적 및 입금 계좌 요청',payment:'최종 견적 확인 후 계좌이체',protection:'국내 배송 선지급 주문은 입금 전에 결제대금예치(에스크로) 또는 소비자피해보상보험계약등을 선택하실 수 있습니다. 원하시는 방식을 알려주시면 보호 절차와 확인된 계좌 정보를 서면으로 안내합니다. 확인 전에는 입금하지 마세요.',steps:['담아둔 작품과 옵션을 확인합니다.','준비된 주문 요청을 아뜰리에에 보냅니다.','서면으로 확정된 견적과 입금 계좌를 받은 뒤, 내용을 확인하고 이체합니다.'],name:'이름',email:'이메일',prepare:'주문 요청 복사 후 인스타그램 열기',copyHelp:'이 페이지는 문의 문구를 준비할 뿐, 결제나 주문을 자동으로 진행하지 않습니다.',copied:'주문 요청을 복사했습니다. @atelier_tamara_de_launay DM에 붙여넣어 보내주세요.',failed:'자동 복사에 실패했습니다. 아래 내용을 직접 복사해 DM으로 보내주세요.',added:'장바구니에 담았습니다.',natural:'천연 다이아몬드 · 추가 비용 발생, 가격 문의',notFinal:'표시된 시작가는 대략적인 안내이며 결제금액이 아닙니다. 배송비와 세금 등은 최종 견적에서 확정됩니다.',consentTitle:'고객 한 분만을 위한 제작',consentNotice:'모든 작품은 고객 한 분이 확정한 사양에 맞춰 주문제작합니다. 제작이 시작된 후 단순 변심으로 인한 취소·교환·반품은 법률이 허용하는 경우에 한해 제한될 수 있습니다. 주문과 결제 전에 최종 사양·가격·일정을 서면으로 안내하고, 청약철회 제한이 적용된다면 주문별로 별도 고지와 서면 또는 전자문서 동의를 받습니다.',consentRights:'하자·파손, 주문 내용과 다른 제작·배송 등 법률상 권리는 그대로 보장됩니다.',consentCheck:'주문제작 안내를 읽었으며, 지금은 문의만 보내는 단계임을 이해했습니다. 최종 주문과 법률상 필요한 별도 동의는 서면 견적을 받은 뒤 진행합니다.',consentRecord:'문의 단계 주문제작 안내 확인 (최종 주문에 대한 별도 동의 아님)'}};
function readCart(){try{const items=JSON.parse(localStorage.getItem('atelier-cart')||'[]');return Array.isArray(items)?items.filter(x=>Number.isInteger(x.n)&&x.n>=1&&x.n<=9&&['natural','lab-grown','confirm'].includes(x.origin)&&['white','pink','yellow','blue','other'].includes(x.color)&&['white','yellow','rose','pictured'].includes(x.gold)&&Number.isInteger(x.qty)&&x.qty>0&&x.qty<=10&&(!ringIds.has(x.n)||x.size===undefined||x.size==='consult'||Number.isInteger(x.size)&&x.size>=44&&x.size<=72)).slice(0,30):[]}catch(_){return []}}
function writeCart(items){localStorage.setItem('atelier-cart',JSON.stringify(items));const badge=document.getElementById('cart-count');if(badge)badge.textContent=items.reduce((n,x)=>n+x.qty,0)||''}
function cartVariant(item){const o=jewelryOptions[lang],t=cartText[lang];const color=o.diamond.find(([k])=>k===item.color)?.[1]||item.color;const gold=item.gold==='pictured'?t.pictured:o.gold.find(([k])=>k===item.gold)?.[1]||item.gold;const origin=item.origin==='confirm'?t.confirm:item.origin==='natural'?o.natural:o.lab;return `${origin} · ${color} · ${gold}${ringIds.has(item.n)?` · ${ringCopy[lang].variant}: ${Number.isInteger(item.size)?item.size+' mm':ringCopy[lang].unsure}`:''}`}
function addCart(n,mode){const id=`detail-${n}`;const checked=key=>document.querySelector(`input[name="${key}-${id}"]:checked`)?.value;const item={n,origin:checked('diamond-origin')||'lab-grown',color:checked('diamond-color')||picturedColor[n],gold:checked('gold-color')||picturedGold[n],size:ringIds.has(n)?Number(document.getElementById(`ring-size-${n}`)?.value)||'consult':null,qty:1};const items=readCart(),same=items.find(x=>x.n===item.n&&x.origin===item.origin&&x.color===item.color&&x.gold===item.gold&&x.size===item.size);if(same)same.qty=Math.min(10,same.qty+1);else items.push(item);writeCart(items);const feedback=document.getElementById('cart-feedback');feedback.innerHTML=`${cartText[lang].added} <a href="#cart">${labels[lang].cart} →</a>`;feedback.hidden=false}
function cartPage(){const t=cartText[lang],items=readCart();return `<section class="page-hero"><span class="eyebrow">Atelier Tamara de Launay</span><h1>${t.title}</h1><p>${t.lead}</p></section><section class="container cart-page">${items.length?`<div class="cart-layout"><div class="cart-items">${items.map((item,i)=>{const product=productRecord(item.n);return `<article class="cart-item"><a href="#piece-${item.n}"><img src="collection-${item.n}-editorial.webp" alt="${product.name}"></a><div><h2><a href="#piece-${item.n}">${product.name}</a></h2><p>${cartVariant(item)}</p><p>${item.origin==='natural'?t.quote:product.spec.price?`${t.from} USD ${product.spec.price.toLocaleString('en-US')}`:t.quote}</p><div class="cart-item-actions"><span>× ${item.qty}</span><button type="button" data-remove-cart="${i}">${t.remove}</button></div></div></article>`}).join('')}<p class="notice">${t.notFinal}</p>${sharePanel('cart')}</div><aside class="cart-checkout"><h2>${t.payment}</h2><p class="notice">${t.protection}</p><ol>${t.steps.map(x=>`<li>${x}</li>`).join('')}</ol><form id="cart-request" autocomplete="off"><label for="cart-name">${t.name}</label><input id="cart-name" name="name" required autocomplete="off"><label for="cart-email">${t.email}</label><input id="cart-email" name="email" type="email" required autocomplete="off"><div class="cart-consent"><h3>${t.consentTitle}</h3><p>${t.consentNotice}</p><p class="cart-consent-rights">${t.consentRights} <a href="#legal">${labels[lang].legal} ↗</a></p><label class="cart-consent-choice" for="cart-made-to-order"><input id="cart-made-to-order" name="made_to_order_acknowledged" type="checkbox" value="yes" required><span>${t.consentCheck}</span></label></div><button class="button fill" type="submit">${t.prepare}</button><p class="form-note">${t.copyHelp}</p><p id="cart-response" class="success" role="status" hidden></p></form></aside></div>`:`<div class="cart-empty"><p>${t.empty}</p><a class="button fill" href="#collection">${t.browse}</a></div>`}</section>`}
function collectionCardSpecs(spec){const t=catalogLabels[lang];const rows=[['diamond',spec.total],['center',spec.center],['melee',spec.melee],['pieces',spec.pieces],['goldWeight',spec.goldWeight]].filter(([,value])=>value!==undefined);return `<div class="card-specs"><div class="card-spec-row"><span>${lang==='ko'?'골드 함량':'Gold purity'}</span><strong>${spec.gold}</strong></div>${rows.length?rows.map(([key,value])=>`<div class="card-spec-row"><span>${t[key]}</span><strong>${value}</strong></div>`).join(''):`<p class="card-spec-pending">${lang==='ko'?'캐럿·골드 중량은 개별 문의 시 안내':'Carat and gold weights confirmed on inquiry'}</p>`}</div>`}
function collectionCard(n){const piece=productRecord(n),q=productPageCopy[lang],si=collectionIndex.signature.indexOf(n),photo=si>=0?editorialPhotos[si]:`collection-${n}-editorial.webp`,wished=readWishlist().includes(n);return `<article class="signature-card"><a class="product-card-image-link" href="#piece-${n}" aria-label="${q.view}: ${piece.name}"><div class="signature-main"><img src="${photo}" alt="${piece.name}, ${photoLabels[lang]}" loading="lazy"></div></a><p class="editorial-note">${editorialNote[lang]}</p><h3><a href="#piece-${n}">${piece.name}</a></h3><div class="meta">${piece.type}</div><p>${piece.description}</p>${collectionCardSpecs(piece.spec)}<p class="catalog-price">${piece.spec.price?`${catalogLabels[lang].starts} USD ${piece.spec.price.toLocaleString('en-US')}`:catalogLabels[lang].request}</p><div class="signature-inquire"><a class="button" href="#piece-${n}">${q.view}</a><button type="button" class="wish-button" data-wish="${n}" aria-pressed="${wished}">${wished?'♥':'♡'} ${labels[lang].wishlist}</button></div></article>`}
function toneCards(tone){return toneGroups[tone].map(collectionCard).join('')}

const shareText={en:{title:'Share this',native:'Share…',copy:'Copy link',email:'Email a hint',whatsapp:'WhatsApp',facebook:'Facebook',messenger:'Messenger',kakao:'KakaoTalk',hint:'Send a hint to someone you love.',copied:'Link copied.',choose:'Choose the app in your device’s share menu. If it is unavailable, the link is copied for you to paste.',empty:'Your wishlist is waiting for its first piece.',save:'Save a piece to start your wishlist.',remove:'Remove',view:'View piece',wishlist:'Your wishlist',shareCart:'Share your selection',shareWish:'Share your wishlist'},ko:{title:'공유하기',native:'공유 메뉴',copy:'링크 복사',email:'이메일로 힌트 보내기',whatsapp:'WhatsApp',facebook:'Facebook',messenger:'Messenger',kakao:'카카오톡',hint:'마음에 드는 주얼리를 소중한 사람에게 살짝 알려주세요.',copied:'링크를 복사했습니다.',choose:'기기의 공유 메뉴에서 앱을 선택해 주세요. 사용할 수 없으면 링크가 복사되니 앱에 붙여넣어 보내세요.',empty:'아직 위시리스트가 비어 있습니다.',save:'마음에 드는 작품을 위시리스트에 담아보세요.',remove:'삭제',view:'작품 보기',wishlist:'나의 위시리스트',shareCart:'담은 작품 공유하기',shareWish:'위시리스트 공유하기'}};
function readWishlist(){try{const x=JSON.parse(localStorage.getItem('atelier-wishlist')||'[]');return Array.isArray(x)?[...new Set(x.filter(n=>Number.isInteger(n)&&n>=1&&n<=9))]:[]}catch(_){return []}}
function writeWishlist(items){localStorage.setItem('atelier-wishlist',JSON.stringify(items))}
function sharePanel(kind,n){const t=shareText[lang];return `<div class="share-panel" data-share-kind="${kind}" ${n?`data-share-piece="${n}"`:''}><h3>${kind==='cart'?t.shareCart:kind==='wishlist'?t.shareWish:t.title}</h3>${kind==='wishlist'?`<p>${t.hint}</p>`:''}<div class="share-actions"><button type="button" data-share="native">${t.native}</button><button type="button" data-share="copy">${t.copy}</button><button type="button" data-share="email">${t.email}</button><button type="button" data-share="whatsapp">${t.whatsapp}</button><button type="button" data-share="facebook">${t.facebook}</button><button type="button" data-share="messenger">${t.messenger}</button><button type="button" data-share="kakao">${t.kakao}</button></div><p class="share-status" role="status" hidden></p></div>`}
function wishlistPage(){const t=shareText[lang],items=readWishlist();return `<section class="page-hero"><span class="eyebrow">Atelier Tamara de Launay</span><h1>${t.wishlist}</h1><p>${items.length?t.hint:t.empty}</p></section><section class="container">${items.length?`<div class="wishlist-grid">${items.map(n=>{const product=productRecord(n);return `<article class="wishlist-card"><a href="#piece-${n}"><img src="collection-${n}-editorial.webp" alt="${product.name}"></a><h2>${product.name}</h2><a class="button" href="#piece-${n}">${t.view}</a><button type="button" class="wish-button" data-wish="${n}" aria-pressed="true">♥ ${t.remove}</button></article>`}).join('')}</div>${sharePanel('wishlist')}`:`<div class="wishlist-empty"><p>${t.save}</p><a class="button fill" href="#collection">${labels[lang].collection} →</a></div>`}</section>`}
function encodeShare(items){return btoa(JSON.stringify(items)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decodeShare(raw){try{return JSON.parse(atob(raw.replace(/-/g,'+').replace(/_/g,'/')))}catch(_){return null}}
function shareUrl(kind,n){const base=location.origin+location.pathname;if(kind==='wishlist')return `${base}#wishlist?items=${readWishlist().join(',')}`;if(kind==='cart'){const items=readCart().slice(0,30).map(x=>[x.n,x.origin,x.color,x.gold,x.size,x.qty]);return `${base}#cart?items=${encodeShare(items)}`}const id=`detail-${n}`,val=key=>document.querySelector(`input[name="${key}-${id}"]:checked`)?.value;const params=new URLSearchParams({o:val('diamond-origin')||'lab-grown',c:val('diamond-color')||picturedColor[n],g:val('gold-color')||picturedGold[n]});if(ringIds.has(n))params.set('s',document.getElementById(`ring-size-${n}`)?.value||'consult');return `${base}#piece-${n}?${params}`}
async function copyShare(url){try{await navigator.clipboard.writeText(url);return true}catch(_){return false}}
async function handleShare(button){const panel=button.closest('.share-panel'),kind=panel.dataset.shareKind,n=Number(panel.dataset.sharePiece),url=shareUrl(kind,n),action=button.dataset.share,t=shareText[lang],name=kind==='piece'?productRecord(n).name:kind==='cart'?cartText[lang].title:t.wishlist,message=`${name} — Atelier Tamara de Launay: ${url}`,status=panel.querySelector('.share-status');if(action==='email'){location.href=`mailto:?subject=${encodeURIComponent(lang==='ko'?'이 주얼리 어때요?':'A little jewelry hint')}&body=${encodeURIComponent(message)}`;return}if(action==='whatsapp'){window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`,'_blank','noopener');return}if(action==='facebook'){window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`,'_blank','noopener');return}if(action==='copy'){status.textContent=await copyShare(url)?t.copied:url;status.hidden=false;return}if(navigator.share){try{await navigator.share({title:name,text:message,url});return}catch(e){if(e.name==='AbortError')return}}const copied=await copyShare(url);status.textContent=copied?t.choose:url;status.hidden=false;if(action==='messenger')window.open('https://www.messenger.com/','_blank','noopener');if(action==='kakao')window.open('https://talk.kakao.com/','_blank','noopener')}
const stoneGuide={"en":{"eyebrow":"The Atelier Standard","title":"A higher standard for every stone.","lead":"The beauty of a jewel begins long before it is set. We choose each stone for what it truly offers, then make the piece around the person who will wear it.","selection":"Precision in selection. Transparency in every detail.","selectionText":"We consider each stone’s color, cut, clarity, origin, any post-growth treatment, relevant independent reports, and market value. We seek out stones personally, then examine as much as possible beyond what a report can capture. Our recommendations rest on the quality of the stone before us, and we explain the reasons with confidence and clarity.","criteria":["Color","Cut & light","Clarity","Origin","Treatments","Reports & value"],"commitment":"The Atelier Tamara de Launay Commitment","curated":"Hand-Curated Excellence","curatedText":"We do not source from generic bulk parcels. Natural and laboratory-grown stones are selected individually for exceptional color, clarity, and optical performance within the budget we discuss with you.","setting":"Master Setting","settingText":"Our craftspeople consider each stone and its setting together. Careful benchwork brings out its beauty while attending to secure construction and the demands of regular wear.","care":"Lifetime Care","careText":"A finished piece begins an enduring relationship. While Atelier Tamara de Launay is in business, every piece carries lifetime care and a warranty for defects in our workmanship, including routine inspections and professional cleaning, subject to our care terms.","origin":"Your choice of origin","originText":"We work with natural and laboratory-grown diamonds and colored gemstones. Where both are available, we explain the origin, quality, treatments, documentation, and price of the particular stones under consideration. The choice remains yours.","visualNote":"Editorial visualization. Stone specifications are confirmed individually before an order.","closer":"Let us find the stone worth building a piece around.","closerText":"Tell us what you love, how you wish to wear it, and the budget you have in mind. We will present a considered path forward.","cta":"Begin a conversation"},"ko":{"eyebrow":"아뜰리에의 기준","title":"보석 한 점부터 남다르게.","lead":"주얼리의 아름다움은 세팅 훨씬 이전, 원석을 고르는 순간부터 시작됩니다. 착용하실 분을 생각하며 보석을 고르고, 그 한 분을 위한 작품을 만듭니다.","selection":"선별은 정교하게, 기준은 투명하게.","selectionText":"원석마다 색, 컷, 투명도, 기원, 성장 후 처리 여부, 해당하는 독립 감정서와 시장 가격을 함께 살핍니다. 직접 발로 뛰며 찾은 원석은 감정서에 담기지 않는 부분까지 최대한 직접 검수합니다. 눈앞의 보석이 지닌 품질을 근거로 판단하고, 자신 있게 추천하는 이유를 이해하실 수 있도록 설명해 드립니다.","criteria":["색","컷과 빛","투명도","기원","처리 여부","감정서와 가격"],"commitment":"아뜰리에 타마라 드 로네의 약속","curated":"한 점씩 엄선한 원석","curatedText":"획일적인 대량 원석 묶음에서 고르지 않습니다. 천연과 랩그로운을 가리지 않고, 상담한 예산 안에서 색과 투명도, 빛의 표현이 뛰어난 보석을 한 점씩 살펴 고릅니다.","setting":"완성도를 위한 세공","settingText":"숙련된 세공사가 보석의 특성과 세팅을 함께 고려합니다. 보석의 아름다움을 살리면서도 안정적인 구조와 일상적인 착용까지 세심하게 살핍니다.","care":"평생 이어지는 관리","careText":"작품이 완성된 뒤에도 관계는 계속됩니다. 아뜰리에 타마라 드 로네가 영업하는 동안 모든 작품에 제작상 결함에 대한 평생 보증과 정기 점검·전문 세척을 포함한 평생 관리 서비스를 제공합니다. 자세한 범위는 약관을 확인해 주세요.","origin":"기원은 고객님의 선택","originText":"천연 혹은 랩그로운 다이아몬드와 유색보석을 다룹니다. 두 가지 선택지가 있는 경우, 실제로 제안드리는 원석의 기원과 품질, 처리 여부, 감정 자료와 가격을 함께 설명합니다. 선택은 고객님의 몫입니다.","visualNote":"연출 이미지입니다. 주문 전 실제 원석과 사양을 개별적으로 확인합니다.","closer":"작품으로 탄생할 가치가 있는 보석을 찾아, 고객님의 오랜 꿈을 이루어드립니다.","closerText":"상상 속 “드림 주얼리”의 모습과 생각하고 계신 예산을 들려주세요. 고객님의 품격에 걸맞은 제안을 준비하겠습니다.","cta":"상담 시작하기"}};

const routes=['home','story','collection','bespoke','stones','contact','wishlist','cart'];let lang=localStorage.getItem('atelier-language')||'en';if(!['en','ko'].includes(lang))lang='en';const icon='';const sourceLinks=[["Rapaport, Diamond Market Cautious at Start of Year, January 2026", "https://rapaport.com/news/diamond-market-cautious-at-start-of-year/"], ["Tiffany & Co., Form 10-K for fiscal year ended January 31, 2020, SEC", "https://www.sec.gov/Archives/edgar/data/98246/000009824620000042/tif-2020131x10k.htm"], ["Reuters, gold share of luxury jewelry sales, October 2025", "https://www.reuters.com/business/soaring-gold-prices-bring-new-headache-tiffany-owner-lvmh-2025-10-13/"], ["Reuters, Dior supplier investigation, June 2024", "https://www.reuters.com/business/retail-consumer/italian-court-seeks-tougher-checks-luxury-suppliers-after-worker-exploitation-2024-06-12/"], ["World Gold Council, 2025 gold price", "https://www.gold.org/goldhub/gold-focus/2026/01/india-gold-market-update-enduring-demand-strength"]];function button(route,key,filled=false){return `<a class="button ${filled?'fill':''}" href="#${route}">${labels[lang][key]}</a>`}function render(){let [route,sharedQuery='']=(location.hash.slice(1)||'home').split('?');const sharedParams=new URLSearchParams(sharedQuery);if(route==='wishlist'&&sharedParams.has('items')&&window.__importedShareLink!==location.hash){window.__importedShareLink=location.hash;const imported=sharedParams.get('items').split(',').map(Number).filter(n=>Number.isInteger(n)&&n>=1&&n<=9);writeWishlist([...new Set([...readWishlist(),...imported])]);window.history?.replaceState(null,'','#wishlist')}if(route==='cart'&&sharedParams.has('items')&&window.__importedShareLink!==location.hash){window.__importedShareLink=location.hash;const tuples=decodeShare(sharedParams.get('items'));if(Array.isArray(tuples)){const imported=tuples.slice(0,30).filter(Array.isArray).map(([n,origin,color,gold,size,qty])=>({n,origin,color,gold,size,qty}));const valid=imported.filter(x=>Number.isInteger(x.n)&&x.n>=1&&x.n<=9&&['natural','lab-grown','confirm'].includes(x.origin)&&['white','pink','yellow','blue','other'].includes(x.color)&&['white','yellow','rose','pictured'].includes(x.gold)&&Number.isInteger(x.qty)&&x.qty>0&&x.qty<=10);writeCart([...readCart(),...valid].slice(0,30));window.history?.replaceState(null,'','#cart')}}if(route==='privacy'||route==='terms')route='legal';if(route==='founders')route='story';let pieceNumber=/^piece-([1-9])$/.exec(route);if(![...routes,'legal'].includes(route)&&!pieceNumber)route='home';let t=copy[lang],l=labels[lang];document.documentElement.lang=lang;document.title=`${pieceNumber?productRecord(Number(pieceNumber[1])).name:l[route]} | Atelier Tamara de Launay`;document.getElementById('nav').innerHTML=routes.map(r=>`<a href="#${r}" class="${r===route?'active':''}">${l[r]}${r==='cart'?` <span id="cart-count">${readCart().reduce((n,x)=>n+x.qty,0)||''}</span>`:''}</a>`).join('');let langs=Object.keys(copy).map(x=>`<button class="lang ${lang===x?'active':''}" data-lang="${x}" aria-label="${{en:'English',fr:'Français',ko:'한국어'}[x]}">${x.toUpperCase()}</button>`).join('');document.getElementById('languages').innerHTML=langs;document.getElementById('footlinks').innerHTML=`<a href="https://www.instagram.com/atelier_tamara_de_launay/" target="_blank" rel="noopener noreferrer">Instagram</a><a href="#stones">${l.stones}</a><a href="#legal">${l.legal}</a><div class="languages">${langs}</div>`;document.getElementById('year').textContent=new Date().getFullYear();let selectedInquiry=null;try{const candidate=JSON.parse(sessionStorage.getItem('atelier-inquiry')||'null');if(candidate&&Number.isInteger(candidate.n)&&candidate.n>=1&&candidate.n<=9&&Date.now()-candidate.time<30*60*1000)selectedInquiry=candidate}catch(_){}let app=document.getElementById('app');if(route==='home')app.innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">${t.homeEyebrow}</div><h1>${t.heroTitle}</h1><p class="
